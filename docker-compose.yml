services:
  postgres:
    image: postgres:16-alpine
    container_name: projetobarber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barber_db}
      POSTGRES_USER: ${DB_USERNAME:-barber_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe_StrongProdPass!2026}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - barber_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projetobarber-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: America/Sao_Paulo
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-barber_db}
      DB_USERNAME: ${DB_USERNAME:-barber_user}
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMe_StrongProdPass!2026}
      JWT_SECRET: ${JWT_SECRET:-fQUKXewf8e6NeK8Hx4+YQ4mdJ7OEu5cCSqtLbR6Xm0cIUs8VjvfmajbibVos8/xv}
      JWT_ISSUER: ${JWT_ISSUER:-ProjetoBarber-API}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-8}
      GESTOR_NOME: ${GESTOR_NOME:-Gestor Tenorio}
      GESTOR_EMAIL: ${GESTOR_EMAIL:-gestor@tenoriosbarber.com}
      GESTOR_SENHA: ${GESTOR_SENHA:-GestorBarber@2026!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    image: nginx:1.27-alpine
    container_name: projetobarber-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  barber_postgres_data:
