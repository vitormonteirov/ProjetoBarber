services:
  postgres:
    image: postgres:16-alpine
    container_name: projetobarber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barber_db}
      POSTGRES_USER: ${DB_USERNAME:-barber_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe_StrongProdPass!2026}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - barber_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  barber_postgres_data:
