<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberShop - Painel de Controle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💈 Barbearia - Painel de Integração</h1>
            <p>Front-end conectado à API Spring Boot</p>
            <div class="badge-status">
                <span id="api-status-dot" class="dot"></span>
                <span id="api-status-text">Verificando conexão com a API...</span>
            </div>
        </header>

        <div id="msg-feedback" class="alert"></div>

        <main class="grid">
            <!-- Formulário de Cadastro -->
            <section class="card">
                <h2>➕ Cadastrar Novo Cliente</h2>
                <form id="form-cliente">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Ex: Carlos Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone (DDD + Número)</label>
                        <input type="tel" id="telefone" placeholder="Ex: 11987654321" minlength="10" maxlength="15" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Ex: carlos@email.com" required>
                    </div>

                    <button type="submit">Cadastrar no Banco</button>
                </form>
            </section>

            <!-- Lista de Clientes -->
            <section class="card">
                <h2>
                    <span>👥 Clientes Cadastrados</span>
                    <button id="btn-refresh" class="btn-refresh" title="Recarregar lista">🔄 Atualizar</button>
                </h2>
                <div id="lista-clientes" class="list-container">
                    <p class="empty-state">Carregando clientes...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
