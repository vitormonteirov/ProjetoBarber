spring.application.name=ProjetoBarber

# Importar variáveis do .env (Spring Boot 2.4+)
spring.config.import=optional:file:.env

# Configuracoes de Banco de Dados (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/barber_db_java10x?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
