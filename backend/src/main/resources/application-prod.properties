# ==========================================================================
# PERFIL DE PRODUÇÃO (prod) — PostgreSQL + Flyway + Hardening Estrito
# Ative com: SPRING_PROFILES_ACTIVE=prod
# ==========================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/barber_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:barber_user}
spring.datasource.password=${DB_PASSWORD}

# Console H2 permanentemente desabilitado em produção
spring.h2.console.enabled=false

# JPA / Hibernate estrito (nunca altera schema sozinho em produção; validado pelo Flyway)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Migrações controladas pelo Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Swagger UI pode ser desabilitado em produção via SWAGGER_ENABLED=false se desejado
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
