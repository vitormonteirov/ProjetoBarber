spring.application.name=ProjetoBarber

# Importar variaveis do .env (se existir)
spring.config.import=optional:file:.env

# Configuracaoes Banco de Dados - H2 em memoria (com fallback para testes e dev)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:barber_db_java10x;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Ativar console H2 na web para inspecao de dados
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA e Hibernate (Para o H2 em desenvolvimento, deixamos o Spring criar as tabelas)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (Desligado temporariamente pro H2)
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Seguranca e JWT (chave injetada via ENV em producao / dev secret padrao)
api.security.token.secret=${JWT_SECRET:projeto-barber-secret-key-super-segura-e-forte-para-jwt-token-hmac-sha-256}
api.security.token.issuer=${JWT_ISSUER:ProjetoBarber-API}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:8}
