spring.application.name=ProjetoBarber

# Perfil ativo padrão (dev para desenvolvimento local; altere para 'prod' em produção via SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Importar variaveis do .env (se existir)
spring.config.import=optional:file:.env

# Configuracaoes Banco de Dados padrao (sobrescritas por application-dev ou application-prod)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:barber_db_java10x;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Console H2 DESATIVADO por padrao por seguranca (ative apenas localmente via H2_CONSOLE_ENABLED=true)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Desativa Open-In-View para liberar conexões do pool imediatamente após as transações
spring.jpa.open-in-view=false

# Escalabilidade: Ativação de Virtual Threads (Project Loom no Tomcat 11 / Java 21+)
spring.threads.virtual.enabled=true

# Usabilidade da API: Ativação do padrão RFC 7807 (Problem Details)
spring.mvc.problemdetails.enabled=true

# Documentação Interativa OpenAPI 3 / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Proteção contra sobrecarga de memória (DoS via paginação gigante ?size=99999999)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Proteção contra sobrecarga de payload e conexões lentas (Slowloris / Large Payload DoS)
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB
server.connection-timeout=10s

# Limites de Rate Limiting por IP (Requisições por minuto)
app.security.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.ratelimit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:15}
app.security.ratelimit.api-per-minute=${RATE_LIMIT_API_PER_MINUTE:120}

# Otimização do Pool de Conexões HikariCP para alta concorrência
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Seguranca e JWT (injetado via ENV JWT_SECRET / fallback aleatorio de 384 bits)
api.security.token.secret=${JWT_SECRET:fQUKXewf8e6NeK8Hx4+YQ4mdJ7OEu5cCSqtLbR6Xm0cIUs8VjvfmajbibVos8/xv}
api.security.token.issuer=${JWT_ISSUER:ProjetoBarber-API}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# Credenciais da Conta Previa do Gestor
app.gestor.nome=${GESTOR_NOME:Gestor Tenorio}
app.gestor.email=${GESTOR_EMAIL:gestor@tenoriosbarber.com}
app.gestor.senha=${GESTOR_SENHA:GestorBarber@2026!}
