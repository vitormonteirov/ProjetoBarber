spring.application.name=ProjetoBarber

# Importar variaveis do .env (se existir)
spring.config.import=optional:file:.env

# Configuracaoes Banco de Dados - H2 em memoria (com fallback para testes e dev)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:barber_db_java10x;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Ativar console H2 na web para inspecao de dados
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA e Hibernate (Para o H2 em desenvolvimento, deixamos o Spring criar as tabelas)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (Desligado temporariamente pro H2)
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Desativa Open-In-View para liberar conexões do pool imediatamente após as transações
spring.jpa.open-in-view=false

# Escalabilidade: Ativação de Virtual Threads (Project Loom no Tomcat 11 / Java 21+)
spring.threads.virtual.enabled=true

# Usabilidade da API: Ativação do padrão RFC 7807 (Problem Details)
spring.mvc.problemdetails.enabled=true

# Otimização do Pool de Conexões HikariCP para alta concorrência
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Seguranca e JWT (injetado via ENV JWT_SECRET / fallback aleatorio de 384 bits)
api.security.token.secret=${JWT_SECRET:fQUKXewf8e6NeK8Hx4+YQ4mdJ7OEu5cCSqtLbR6Xm0cIUs8VjvfmajbibVos8/xv}
api.security.token.issuer=${JWT_ISSUER:ProjetoBarber-API}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# Credenciais da Conta Previa do Gestor
app.gestor.nome=${GESTOR_NOME:Gestor Tenorio}
app.gestor.email=${GESTOR_EMAIL:gestor@tenoriosbarber.com}
app.gestor.senha=${GESTOR_SENHA:GestorBarber@2026!}
