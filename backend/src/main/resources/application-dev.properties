# ==========================================================================
# PERFIL DE DESENVOLVIMENTO (dev) — H2 em memória / Testes locais rápidos
# ==========================================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:barber_db_java10x;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Console H2 permanece fechado por padrão; habilite apenas se necessário via H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
